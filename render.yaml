services:
  - type: web
    name: machineguard-core-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: IAM_JWT_SECRET
        generateValue: true
      - key: WEB_CORS_ALLOWED_ORIGINS
        value: https://machineguard.github.io
      - key: ACQUISITION_CORS_ALLOWED_ORIGINS
        value: https://machineguard.github.io
      - key: IAM_BOOTSTRAP_ENABLED
        value: "true"
      - key: IAM_BOOTSTRAP_ORGANIZATION_NAME
        value: MachineGuard Demo
      - key: IAM_BOOTSTRAP_ADMIN_NAME
        value: Demo Admin
      - key: IAM_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: IAM_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
