name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pruebas unitarias, de integración y BDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ejecutar pruebas (JUnit + Cucumber)
        run: mvn -B verify

      - name: Publicar reporte Cucumber
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          if-no-files-found: ignore

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/security-check.py secrets --report target/security/secrets.json
      - run: mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -DoutputType=json -DoutputFile=target/dependencies.json
      - run: python scripts/security-check.py dependencies --maven-json target/dependencies.json --report target/security/dependencies.json

  integration:
    name: PostgreSQL real y Edge-Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgci
          POSTGRES_DB: mgci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mgci -d mgci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          persist-credentials: false
      - name: Require access to the private companion repository
        env:
          COMPANION_TOKEN: ${{ secrets.MACHINEGUARD_CI_READ_TOKEN }}
        run: test -n "$COMPANION_TOKEN" || { echo 'Configure a read-only companion repository token'; exit 1; }
      - uses: actions/checkout@v7
        with:
          repository: MachineGuard/machineguard-edge-api
          ref: e93bfe0e694c205206ca3850bb7f00d637d970d5
          path: edge
          token: ${{ secrets.MACHINEGUARD_CI_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r edge/requirements-test.txt
      - run: psql -h 127.0.0.1 -U mgci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mgci_test'
      - name: Run the same local integration commands without skipping live tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/mgci
          MACHINEGUARD_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/mgci_test
          DB_USERNAME: mgci
          DB_PASSWORD: ''
        run: python edge/scripts/edge-core-integration.py --core core --edge edge --report reports/integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: error
