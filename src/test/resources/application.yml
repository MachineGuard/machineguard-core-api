spring:
  datasource:
    url: jdbc:h2:mem:traceability;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

machineguard:
  iam:
    jwt-secret: local-test-key-only-not-for-production-at-least-32-bytes
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 30
  traceability:
    retention-months: 12
    retention-purge-enabled: false
    max-report-days: 366
    measurements-table: measurements
