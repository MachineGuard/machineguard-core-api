server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: machineguard-core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/machineguard}
    username: ${DB_USERNAME:machineguard}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  jackson:
    # Keep the Boot 3 JSON defaults while the API moves to Jackson 3.
    use-jackson2-defaults: true

machineguard:
  monitoring:
    freshness-minimum-seconds: ${CORE_FRESHNESS_MINIMUM_SECONDS:30}
    freshness-interval-multiplier: ${CORE_FRESHNESS_INTERVAL_MULTIPLIER:3}
    max-future-seconds: ${CORE_MAX_FUTURE_SECONDS:60}
    max-reading-age-days: ${CORE_MAX_READING_AGE_DAYS:30}
    min-recorded-at: ${CORE_MIN_RECORDED_AT:2026-01-01T00:00:00Z}
  iam:
    login-limit: ${IAM_LOGIN_LIMIT:5}
    login-window-seconds: ${IAM_LOGIN_WINDOW_SECONDS:60}
    login-max-keys: ${IAM_LOGIN_MAX_KEYS:10000}
    jwt-secret: ${IAM_JWT_SECRET:}
    # SHA-256 hex of the operator key used for global pilot approval. Empty disables /api/v1/operator/**.
    operator-key-hash: ${IAM_OPERATOR_KEY_HASH:}
    issuer: machineguard-iam
    access-token-ttl-seconds: ${IAM_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${IAM_REFRESH_TOKEN_TTL_DAYS:30}
    bootstrap:
      enabled: ${IAM_BOOTSTRAP_ENABLED:false}
      organization-name: ${IAM_BOOTSTRAP_ORGANIZATION_NAME:}
      admin-name: ${IAM_BOOTSTRAP_ADMIN_NAME:}
      admin-email: ${IAM_BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${IAM_BOOTSTRAP_ADMIN_PASSWORD:}
  acquisition:
    # Exact Landing origins allowed to POST /api/v1/pilot-requests. Empty disables CORS for that route.
    cors-allowed-origins: ${ACQUISITION_CORS_ALLOWED_ORIGINS:}
    pilot-ip-limit: ${ACQUISITION_PILOT_IP_LIMIT:20}
    pilot-window-seconds: ${ACQUISITION_PILOT_WINDOW_SECONDS:3600}
    pilot-max-keys: ${ACQUISITION_PILOT_MAX_KEYS:10000}
  traceability:
    # Retention Period del Measurement History y de las excursiones (meses).
    retention-months: ${TRACEABILITY_RETENTION_MONTHS:60}
    # Depuracion automatica diaria; desactivada por defecto porque elimina evidencia.
    retention-purge-enabled: ${TRACEABILITY_PURGE_ENABLED:false}
    max-report-days: 366
    # Tabla de Environmental Monitoring de la que se lee el Measurement History.
    measurements-table: ${TRACEABILITY_MEASUREMENTS_TABLE:measurements}

springdoc:
  api-docs:
    enabled: ${CORE_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${CORE_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
